# ============================================================================
# Scheduled GitHub -> Azure DevOps sync
# ----------------------------------------------------------------------------
# Pulls the upstream GitHub repository into this Azure DevOps repo's `main`
# branch. GitHub is the source of truth.
#
# What is synced (syncRef):
#   latest-release : the newest published GitHub release (a tested, tagged
#                    version such as v3.0.0). <-- DEFAULT, recommended
#   main           : the newest commit on GitHub main (may be unreleased).
#
# Your own pipeline settings survive the sync. With the default reset
# strategy these edits are carried over to every new version:
#   - the default of productionApprovalEnvironment (azure-pipelines.yml and
#     pipelines/azure-pipelines-federated.yml)
#   - an uncommented schedules: block in those two files
#   - the serviceConnection variable of the federated pipeline
# Any other local change is replaced by the released file.
#
# Prerequisites (one-time):
#   1. Project settings -> Repositories -> your repo -> Security:
#      Grant "<Project> Build Service (<Org>)" the "Contribute" permission.
#      For the default RESET strategy also grant "Force push (rewrite history
#      and delete refs)".
#   2. If `main` is protected by a branch policy, add the build service as an
#      exception or the force push will be blocked.
#   3. System.AccessToken is exposed automatically to the steps below.
# ============================================================================

# No CI trigger - this pipeline is schedule-driven only.
trigger: none
pr: none

schedules:
  - cron: "0 6 * * 1"          # weekly, Mondays at 06:00 UTC
    displayName: Weekly GitHub sync
    branches:
      include:
        - main
    always: true               # run even when there are no source changes

pool:
  vmImage: ubuntu-latest

variables:
  githubRepo: 'lazejanev/d365-tenant-app-updater'
  githubUrl: 'https://github.com/$(githubRepo).git'
  targetBranch: 'main'
  # Sync strategy:
  #   reset   : mirror. Force-resets Azure DevOps to exactly match GitHub
  #             (discards any commits made only in Azure DevOps). Use this
  #             when GitHub is the single source of truth. <-- DEFAULT
  #   ff-only : safe. Only advances when Azure DevOps has no diverging commits.
  #             Fails if the two histories have diverged.
  syncStrategy: 'reset'
  syncRef: 'latest-release'

steps:
  # Check out the Azure DevOps repo and keep the OAuth credentials so we can
  # push back to origin later.
  - checkout: self
    persistCredentials: true
    fetchDepth: 0              # full history is required for merge/reset

  - script: |
      set -euo pipefail
      echo "Configuring git identity..."
      git config user.email "build@dev.azure.com"
      git config user.name  "Azure DevOps Sync"

      echo "Adding GitHub upstream remote..."
      git remote remove github 2>/dev/null || true
      git remote add github "$(githubUrl)"

      echo "Fetching from GitHub..."
      git fetch github "$(targetBranch)" --tags --force

      source_ref="github/$(targetBranch)"
      if [ "$(syncRef)" = "latest-release" ]; then
        # github.com/<repo>/releases/latest redirects to the latest release's
        # tag page. Unlike the GitHub API it is not rate limited per agent IP.
        tag=$(curl -fsSL -o /dev/null -w '%{url_effective}' \
          "https://github.com/$(githubRepo)/releases/latest" 2>/dev/null \
          | sed -n 's#.*/releases/tag/##p' || true)
        if [ -z "$tag" ]; then
          tag=$(curl -fsSL -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$(githubRepo)/releases/latest" \
            | python3 -c "import json,sys; print(json.load(sys.stdin).get('tag_name',''))" || true)
        fi
        if [ -n "$tag" ] && git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
          echo "Latest GitHub release: $tag"
          source_ref="refs/tags/$tag"
        else
          # Never fall back to main: that could sync unreleased code. Nothing
          # is changed; the next scheduled sync tries again.
          echo "##vso[task.logissue type=error]Could not read the latest GitHub release (the GitHub API may be rate limiting this agent). Nothing was synced; the next run tries again. Set syncRef = main to sync main instead."
          exit 1
        fi
      fi
      echo "Syncing from: $source_ref"

      echo "Checking out $(targetBranch) (tracking origin)..."
      # The pipeline checkout leaves us on a detached HEAD, and `main` now
      # exists on two remotes (origin + github). Be explicit: create a local
      # branch that tracks origin so the name is never ambiguous.
      git checkout -B "$(targetBranch)" "origin/$(targetBranch)"
      before=$(git rev-parse HEAD)

      if [ "$(syncStrategy)" = "reset" ]; then
        echo "Strategy: reset (mirror GitHub, keep your pipeline settings)"
        git reset --hard "$source_ref"
        if [ -f scripts/sync_keep_settings.py ]; then
          python3 scripts/sync_keep_settings.py "$before"
          if ! git diff --quiet; then
            git commit -qam "Keep local pipeline settings (approval environment, schedule, service connection)"
            echo "Committed your pipeline settings on top of $source_ref."
          fi
        fi
      else
        echo "Strategy: ff-only (safe fast-forward)"
        git merge --ff-only "$source_ref"
      fi
    displayName: 'Fetch and merge from GitHub'

  - script: |
      set -euo pipefail
      echo "Pushing to Azure DevOps origin..."
      if [ "$(syncStrategy)" = "reset" ]; then
        git push origin "HEAD:$(targetBranch)" --force
        git push origin --tags --force
      else
        git push origin "HEAD:$(targetBranch)"
        git push origin --tags --force
      fi
      echo "Sync complete."
    displayName: 'Push to Azure DevOps'
    env:
      SYSTEM_ACCESSTOKEN: $(System.AccessToken)
