# =====================================================================
# Stages: the whole pipeline. Job steps are in run-updater.yml.
# Plan -> Apply non-production -> Apply production.
#
#   Plan                 reads the tenant, writes plan.json, summary.md and
#                        report.json (artifact "plan"). Changes nothing.
#   ApplyNonProduction   applies the non-production actions of the plan.
#                        Runs only when the plan has some.
#   ApplyProduction      applies the production actions of the plan.
#                        By default a normal job: nothing to create first.
#                        Optional approval: create an Azure DevOps
#                        environment, add an Approvals check to it, and set
#                        productionApprovalEnvironment to its name. The stage
#                        then runs as a deployment job to that environment.
#                        (Azure DevOps does not create environments for YAML
#                        that arrives through a git sync, so the default must
#                        not reference one.)
#
# Production actions in a plan were already proven: with productionRing =
# true a production environment only gets a version a non-production
# environment already ran when the plan was made. Apply re-checks every
# action against the live tenant before changing anything.
# =====================================================================

parameters:
  - name: auth
    type: string
    default: secret
  - name: serviceConnection
    type: string
    default: ''
  - name: whatIf
    type: string
    default: useLibraryOrDefault
  - name: usePacFallback
    type: string
    default: useLibraryOrDefault
  # Name of an existing Azure DevOps environment used as the production
  # approval gate. 'none' (default) = no environment, no approval.
  - name: productionApprovalEnvironment
    type: string
    default: none

stages:
  - stage: Plan
    displayName: 'Plan'
    jobs:
      - job: Plan
        displayName: 'Read the tenant and plan'
        timeoutInMinutes: 120
        steps:
          - template: run-updater.yml
            parameters:
              mode: Plan
              artifact: plan
              auth: ${{ parameters.auth }}
              serviceConnection: ${{ parameters.serviceConnection }}

  - stage: ApplyNonProduction
    displayName: 'Apply: non-production'
    dependsOn: Plan
    condition: >
      and(succeeded(),
          ne('${{ parameters.whatIf }}', 'true'),
          eq(dependencies.Plan.outputs['Plan.plan.hasNonProductionActions'], 'true'))
    jobs:
      - job: Apply
        displayName: 'Apply non-production actions'
        timeoutInMinutes: 180
        steps:
          - template: run-updater.yml
            parameters:
              mode: Apply
              ring: NonProduction
              artifact: apply-nonproduction
              planFile: '$(Pipeline.Workspace)/plan/plan.json'
              auth: ${{ parameters.auth }}
              serviceConnection: ${{ parameters.serviceConnection }}
              usePacFallback: ${{ parameters.usePacFallback }}

  - stage: ApplyProduction
    displayName: 'Apply: production'
    dependsOn:
      - Plan
      - ApplyNonProduction
    condition: >
      and(not(failed()), not(canceled()),
          ne('${{ parameters.whatIf }}', 'true'),
          eq(dependencies.Plan.outputs['Plan.plan.hasProductionActions'], 'true'))
    jobs:
      - ${{ if or(eq(parameters.productionApprovalEnvironment, ''), eq(parameters.productionApprovalEnvironment, 'none')) }}:
        - job: Apply
          displayName: 'Apply production actions'
          timeoutInMinutes: 180
          steps:
            - template: run-updater.yml
              parameters:
                mode: Apply
                ring: Production
                artifact: apply-production
                planFile: '$(Pipeline.Workspace)/plan/plan.json'
                auth: ${{ parameters.auth }}
                serviceConnection: ${{ parameters.serviceConnection }}
                usePacFallback: ${{ parameters.usePacFallback }}
      - ${{ else }}:
        - deployment: Apply
          displayName: 'Apply production actions (approval: ${{ parameters.productionApprovalEnvironment }})'
          environment: ${{ parameters.productionApprovalEnvironment }}
          timeoutInMinutes: 180
          strategy:
            runOnce:
              deploy:
                steps:
                  - template: run-updater.yml
                    parameters:
                      mode: Apply
                      ring: Production
                      artifact: apply-production
                      planFile: '$(Pipeline.Workspace)/plan/plan.json'
                      auth: ${{ parameters.auth }}
                      serviceConnection: ${{ parameters.serviceConnection }}
                      usePacFallback: ${{ parameters.usePacFallback }}
