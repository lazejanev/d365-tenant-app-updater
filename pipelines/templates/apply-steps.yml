# Steps of one Apply stage: get the code and the plan, then apply one ring.
parameters:
  - name: ring            # NonProduction | Production
    type: string
  - name: auth
    type: string
    default: secret
  - name: serviceConnection
    type: string
    default: ''
  - name: usePacFallback
    type: string
    default: useLibraryOrDefault

steps:
  - checkout: self
  - download: current
    artifact: plan
  - template: install-pac.yml
    parameters:
      usePacFallback: ${{ parameters.usePacFallback }}
  - template: run-updater.yml
    parameters:
      mode: Apply
      ring: ${{ parameters.ring }}
      stepName: apply
      displayName: 'Apply ${{ parameters.ring }} actions'
      planFile: '$(Pipeline.Workspace)/plan/plan.json'
      outputDirectory: '$(Build.ArtifactStagingDirectory)/apply-${{ lower(parameters.ring) }}'
      auth: ${{ parameters.auth }}
      serviceConnection: ${{ parameters.serviceConnection }}
  - publish: '$(Build.ArtifactStagingDirectory)/apply-${{ lower(parameters.ring) }}'
    artifact: apply-${{ lower(parameters.ring) }}
    displayName: 'Publish reports'
    condition: succeededOrFailed()
