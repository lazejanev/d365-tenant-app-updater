# =====================================================================
# d365-tenant-app-updater
# Update all Dynamics 365 first-party (Dataverse) apps across a tenant,
# report Finance and Operations inventory, and optionally apply F&O
# application versions on eligible environments.
#
# HOW THE TWO PHASES WORK
#   Phase 1 always runs against every environment that passes
#   environmentFilter / environmentExclude. While it inspects each
#   environment it also records which ones have Finance and Operations
#   installed, and the installed version of the F&O Provisioning App
#   Anchor Solution (used later to classify update scope). No extra
#   probing - this is read from data already being fetched.
#
#   Phase 2 - Finance and Operations:
#     INVENTORY     always runs, read-only, no switch. Reports application
#                   version, platform version, deployment type and AOS
#                   counts per F&O environment, then prints a consolidated
#                   table. It costs one GET per F&O environment and changes
#                   nothing, so it is not worth gating.
#     VERSION APPLY controlled by finOpsApplyVersion, default false. This
#                   is the ONLY on/off switch in the F&O phase. It changes
#                   the environment.
#     UPDATE SCOPE  controlled by finOpsUpdateScope, default QualityUpdate.
#                   finopsversions returns entries in the F&O named-release
#                   scheme (e.g. "10.0.48.7", "10.0.49.2"), which can
#                   include both an in-place patch on the CURRENT release
#                   train (QualityUpdate, e.g. 10.0.48.6 -> 10.0.48.7 -
#                   only the last segment differs) and an entirely new
#                   release train (VersionUpdate, e.g. -> 10.0.49.2 - the
#                   3rd segment differs). Selecting "highest available"
#                   without this distinction was confirmed live to select
#                   a full release-wave jump when a smaller same-train
#                   patch was also available. finOpsUpdateScope restricts
#                   which kind may be selected: QualityUpdate (default,
#                   smallest/safest), VersionUpdate (opt into the new
#                   release train), or Any (numerically highest,
#                   regardless of kind - the pre-v2.3.3 behaviour).
#
#   Version apply is gated behind a live route check, so it begins working
#   automatically once the finopsversions route is available. That is
#   precisely why the on/off switch must be set explicitly: no default, no
#   other variable and no platform change can turn it on.
#
# WHAT THE F&O ROUTES RETURN TODAY
#   Verified on a westeurope tenant with an app-only token, reproduced
#   independently via both raw REST calls and the `pac dynamics` CLI:
#     GET  /dynamics/environments/{id}/finopsproperties           -> HTTP 200
#     GET  /dynamics/environments/{id}/finopsversions              -> HTTP 200 (route now live)
#     POST /dynamics/environments/{id}/finopsversions/{v}/apply   -> 202 / 204 per environment
#   The script reports whatever the API returns and does not assert a
#   cause. A RouteNotFound on finopsversions (if seen on a different
#   endpoint) is not counted as a failure.
#
# CONFIGURATION MODEL
#   Required variables in 'D365-TenantAppUpdater':
#       ClientId, ClientSecret (secret), TenantId
#   Everything else has a built-in default in the script. To override any
#   setting, add a variable with the matching name to the group.
#
#   Optional override variables:
#     authority, bapApiRoot, bapApiVersion, powerPlatformScope, ppApiRoot,
#     appManagementApiVersion, finOpsApiVersion, dumpDiagnostics,
#     retryFailedInstalls, whatIf, usePacFallback, environmentFilter,
#     environmentExclude, appExclude, finOpsApplyVersion,
#     finOpsTargetVersion, finOpsEnvironmentFilter, finOpsDeploymentTypes,
#     finOpsUpdateScope
#
#   Retired: updateFinOpsVersion and finOpsInventory. Both are ignored. If
#   either is still in the variable group the script says so once in the
#   log. Remove them.
#
#   Values are passed through env: so an undefined variable stays a
#   harmless literal that the script ignores in favour of its default.
#
# NOTE ON POWERSHELL
#   The task runs with pwsh: true. The Finance and Operations phase needs
#   PowerShell 7. On Windows PowerShell 5.1 it is skipped with a clear
#   message; Phase 1 still runs.
#
# NOTE ON THE POWER PLATFORM CLI
#   The CLI is only needed for the optional app-install fallback
#   (usePacFallback). The F&O phase uses REST and does not need it.
# =====================================================================

name: 'd365-tenant-app-updater-$(Date:yyyyMMdd)$(Rev:.r)'

# ---------------------------------------------------------------------
# Runtime parameters (chosen at queue time)
# ---------------------------------------------------------------------
parameters:
  - name: whatIf
    displayName: 'Plan only (do not install or apply)'
    type: string
    default: useLibraryOrDefault
    values:
      - useLibraryOrDefault
      - 'true'
      - 'false'

  - name: usePacFallback
    displayName: 'Try PAC CLI fallback for custom-install apps'
    type: string
    default: useLibraryOrDefault
    values:
      - useLibraryOrDefault
      - 'true'
      - 'false'

  - name: finOpsApplyVersion
    displayName: 'Apply F&O version (CHANGES environments)'
    type: string
    default: useLibraryOrDefault
    values:
      - useLibraryOrDefault
      - 'true'
      - 'false'

  - name: finOpsUpdateScope
    displayName: 'F&O update scope (QualityUpdate = same train patch, VersionUpdate = new release train, Any = highest regardless)'
    type: string
    default: useLibraryOrDefault
    values:
      - useLibraryOrDefault
      - 'QualityUpdate'
      - 'VersionUpdate'
      - 'Any'

  - name: finOpsTargetVersion
    displayName: 'F&O target version (blank = highest matching scope)'
    type: string
    default: ' '

# ---------------------------------------------------------------------
# Triggers (manual/scheduled). Uncomment the schedule to run nightly.
# ---------------------------------------------------------------------
trigger: none
pr: none

# schedules:
#   - cron: '0 2 * * *'
#     displayName: 'Scheduled tenant app update'
#     branches:
#       include:
#         - main
#     always: true

pool:
  vmImage: 'windows-latest'

variables:
  - group: D365-TenantAppUpdater

  # Queue-time overrides. The sentinel resolves to blank so the script falls
  # back to the library value, then to its own default.
  - name: whatIfOverride
    value: ${{ replace(parameters.whatIf, 'useLibraryOrDefault', '') }}
  - name: usePacOverride
    value: ${{ replace(parameters.usePacFallback, 'useLibraryOrDefault', '') }}
  - name: finOpsApplyOverride
    value: ${{ replace(parameters.finOpsApplyVersion, 'useLibraryOrDefault', '') }}
  - name: finOpsUpdateScopeOverride
    value: ${{ replace(parameters.finOpsUpdateScope, 'useLibraryOrDefault', '') }}

stages:
  - stage: UpdateApps
    displayName: 'Update Dynamics 365 apps tenant wide'
    jobs:
      - job: Update
        displayName: 'Run tenant app updater'
        timeoutInMinutes: 180
        steps:
          - checkout: self

          # Only required for the optional app-install fallback.
          - powershell: |
              $ErrorActionPreference = 'Stop'
              Write-Host 'Installing Power Platform CLI (latest)'
              dotnet tool install --global Microsoft.PowerApps.CLI.Tool
              Write-Host "##vso[task.prependpath]$HOME/.dotnet/tools"
            displayName: 'Install Power Platform CLI'
            condition: >
              and(succeeded(),
                  or(eq('${{ parameters.usePacFallback }}', 'true'),
                     eq(variables['usePacFallback'], 'true')))

          - task: PowerShell@2
            displayName: 'Update applications (and F&O version where enabled)'
            inputs:
              targetType: 'filePath'
              filePath: '$(Build.SourcesDirectory)/scripts/Update-TenantApps.ps1'
              pwsh: true
              failOnStderr: false
              arguments: >
                -ClientId "$(ClientId)"
                -ClientSecret "$(ClientSecret)"
                -TenantId "$(TenantId)"
            env:
              Authority:               $(authority)
              BapApiRoot:              $(bapApiRoot)
              BapApiVersion:           $(bapApiVersion)
              PowerPlatformScope:      $(powerPlatformScope)
              PpApiRoot:               $(ppApiRoot)
              AppManagementApiVersion: $(appManagementApiVersion)
              FinOpsApiVersion:        $(finOpsApiVersion)
              DumpDiagnostics:         $(dumpDiagnostics)
              RetryFailedInstalls:     $(retryFailedInstalls)
              EnvironmentFilter:       $(environmentFilter)
              EnvironmentExclude:      $(environmentExclude)
              AppExclude:              $(appExclude)
              FinOpsEnvironmentFilter: $(finOpsEnvironmentFilter)
              FinOpsDeploymentTypes:   $(finOpsDeploymentTypes)
              # Both the library value and the queue-time override are passed.
              # The script prefers override, then library, then its default.
              WhatIf:                      $(whatIf)
              WhatIfOverride:              $(whatIfOverride)
              UsePacFallback:              $(usePacFallback)
              UsePacFallbackOverride:      $(usePacOverride)
              # The single Finance and Operations ON/OFF switch. Default false.
              FinOpsApplyVersion:          $(finOpsApplyVersion)
              FinOpsApplyVersionOverride:  $(finOpsApplyOverride)
              # Restricts WHICH kind of update apply may select. Default
              # QualityUpdate (same release train patch only).
              FinOpsUpdateScope:           $(finOpsUpdateScope)
              FinOpsUpdateScopeOverride:   $(finOpsUpdateScopeOverride)
              FinOpsTargetVersion:         $(finOpsTargetVersion)
              FinOpsTargetVersionOverride: ${{ parameters.finOpsTargetVersion }}
              # Retired. Passed only so the script can warn if they are still
              # present in the variable group. They have no effect.
              UpdateFinOpsVersion:         $(updateFinOpsVersion)
              FinOpsInventory:             $(finOpsInventory)
