# =====================================================================
# d365-tenant-app-updater v3 - Azure DevOps pipeline (client secret)
#
# Keeps Dynamics 365 first-party (Dataverse) apps and Finance and
# Operations versions current across every environment of a tenant.
#
#   Plan                -> reads the tenant, writes plan.json and the run
#                          summary (Extensions tab). Changes nothing.
#   Apply non-production -> applies the non-production part of the plan.
#   Apply production    -> applies the production part of the plan, as a
#                          deployment to the environment "d365-production".
#
# Production ring (productionRing, default true): a production environment
# only takes a version that a non-production environment already runs.
# Environments and apps are processed and reported A to Z.
#
# Required variables in the variable group 'D365-TenantAppUpdater':
#   ClientId, ClientSecret (secret), TenantId
# Everything else is optional; see docs/parameters.md.
#
# No client secret? Use azure-pipelines-federated.yml (workload identity
# federation, preview). Setup: docs/setup-azure-devops.md
# =====================================================================

name: 'd365-tenant-app-updater-$(Date:yyyyMMdd)$(Rev:.r)'

# ---------------------------------------------------------------------
# Runtime parameters (chosen at queue time)
# ---------------------------------------------------------------------
parameters:
  - name: whatIf
    displayName: 'Plan only (do not install or apply)'
    type: string
    default: useLibraryOrDefault
    values:
      - useLibraryOrDefault
      - 'true'
      - 'false'

  - name: usePacFallback
    displayName: 'Try PAC CLI fallback for custom-install apps'
    type: string
    default: useLibraryOrDefault
    values:
      - useLibraryOrDefault
      - 'true'
      - 'false'

  - name: finOpsApplyVersion
    displayName: 'Apply F&O version (CHANGES environments)'
    type: string
    default: useLibraryOrDefault
    values:
      - useLibraryOrDefault
      - 'true'
      - 'false'

  - name: finOpsUpdateScope
    displayName: 'F&O update scope (QualityUpdate = PQU on the same release train, VersionUpdate = next release train only, Any = highest regardless)'
    type: string
    default: useLibraryOrDefault
    values:
      - useLibraryOrDefault
      - 'QualityUpdate'
      - 'VersionUpdate'
      - 'Any'

  - name: finOpsTargetVersion
    displayName: 'F&O target version (blank = highest matching scope)'
    type: string
    default: ' '

# ---------------------------------------------------------------------
# Triggers (manual/scheduled). Uncomment the schedule to run nightly.
# ---------------------------------------------------------------------
trigger: none
pr: none

# schedules:
#   - cron: '0 2 * * *'
#     displayName: 'Scheduled tenant app update'
#     branches:
#       include:
#         - main
#     always: true

pool:
  vmImage: 'windows-latest'

variables:
  - group: D365-TenantAppUpdater

  # Queue-time overrides. The sentinel resolves to blank so the run falls
  # back to the library value, then to the built-in default.
  - name: whatIfOverride
    value: ${{ replace(parameters.whatIf, 'useLibraryOrDefault', '') }}
  - name: usePacOverride
    value: ${{ replace(parameters.usePacFallback, 'useLibraryOrDefault', '') }}
  - name: finOpsApplyOverride
    value: ${{ replace(parameters.finOpsApplyVersion, 'useLibraryOrDefault', '') }}
  - name: finOpsUpdateScopeOverride
    value: ${{ replace(parameters.finOpsUpdateScope, 'useLibraryOrDefault', '') }}
  - name: finOpsTargetVersionOverride
    value: ${{ parameters.finOpsTargetVersion }}

stages:
  - template: pipelines/templates/updater-stages.yml
    parameters:
      auth: secret
      whatIf: ${{ parameters.whatIf }}
      usePacFallback: ${{ parameters.usePacFallback }}
