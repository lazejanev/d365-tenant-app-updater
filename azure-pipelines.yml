# =====================================================================
# d365-tenant-app-updater
# Automatically update all Dynamics 365 first-party (Dataverse) apps
# across a tenant.
#
# This pipeline calls scripts/Update-TenantApps.ps1, which authenticates
# as a service principal and updates apps on every Dataverse environment.
#
# CONFIGURATION MODEL
#   Only three variables are REQUIRED in the 'D365-TenantAppUpdater'
#   variable group: ClientId, ClientSecret (secret), TenantId.
#
#   Every other setting has a built-in default in the script. To override
#   any of them, simply add a variable with the matching name to the group
#   (see the env: block below for the exact names). If a variable is not
#   defined, the script uses its default. No YAML edits required.
#
#   Optional override variables (all have script defaults):
#     authority, bapApiRoot, bapApiVersion, powerPlatformScope, ppApiRoot,
#     appManagementApiVersion, pollIntervalSec, pollTimeoutMin,
#     dumpDiagnostics, retryFailedInstalls, whatIf, usePacFallback,
#     environmentFilter, environmentExclude, appExclude
#
#   The values are passed through the env: block (not as arguments) so that
#   an undefined variable stays a harmless literal that the script ignores.
#
# Before you run:
#   1. Register the service principal as a Power Platform management app,
#      and add it as an application user (System Administrator) in each
#      target environment's Dataverse. See docs/permissions.md.
#   2. Create the variable group with ClientId, ClientSecret, TenantId
#      (plus any optional overrides you want). Authorize this pipeline.
#   3. Run.
# =====================================================================

name: 'd365-tenant-app-updater-$(Date:yyyyMMdd)$(Rev:.r)'

# ---------------------------------------------------------------------
# Runtime parameters (chosen at queue time). These override the library
# values for a single manual run. Leave "use library / default" to defer
# to the variable group value or the script default.
# ---------------------------------------------------------------------
parameters:
  - name: whatIf
    displayName: 'Plan only (do not install)'
    type: string
    default: useLibraryOrDefault
    values:
      - useLibraryOrDefault
      - 'true'
      - 'false'

  - name: usePacFallback
    displayName: 'Try PAC CLI fallback for custom-install apps'
    type: string
    default: useLibraryOrDefault
    values:
      - useLibraryOrDefault
      - 'true'
      - 'false'

# ---------------------------------------------------------------------
# Triggers (manual/scheduled). Uncomment the schedule to run nightly.
# ---------------------------------------------------------------------
trigger: none
pr: none

# schedules:
#   - cron: '0 2 * * *'
#     displayName: 'Scheduled tenant app update'
#     branches:
#       include:
#         - main
#     always: true

pool:
  vmImage: 'windows-latest'

variables:
  - group: D365-TenantAppUpdater
  # Runtime-parameter overrides. When a parameter is left at the sentinel,
  # this resolves to blank so the script falls back to the library value or
  # its own default.
  - name: whatIfOverride
    value: ${{ replace(parameters.whatIf, 'useLibraryOrDefault', '') }}
  - name: usePacOverride
    value: ${{ replace(parameters.usePacFallback, 'useLibraryOrDefault', '') }}

stages:
  - stage: UpdateApps
    displayName: 'Update Dynamics 365 apps tenant wide'
    jobs:
      - job: Update
        displayName: 'Run tenant app updater'
        timeoutInMinutes: 180
        steps:
          - checkout: self

          # Install the Power Platform CLI only when the PAC fallback is on
          # (either via the runtime parameter or the library variable).
          - powershell: |
              $ErrorActionPreference = 'Stop'
              Write-Host 'Installing Power Platform CLI (latest)'
              dotnet tool install --global Microsoft.PowerApps.CLI.Tool
              Write-Host "##vso[task.prependpath]$HOME/.dotnet/tools"
            displayName: 'Install Power Platform CLI'
            condition: >
              and(succeeded(),
                  or(eq('${{ parameters.usePacFallback }}', 'true'),
                     eq(variables['usePacFallback'], 'true')))

          - task: PowerShell@2
            displayName: 'Update applications that have an update available'
            inputs:
              targetType: 'filePath'
              filePath: '$(Build.SourcesDirectory)/scripts/Update-TenantApps.ps1'
              pwsh: true
              failOnStderr: false
              # Required credentials as arguments (always defined -> safe to expand).
              arguments: >
                -ClientId "$(ClientId)"
                -ClientSecret "$(ClientSecret)"
                -TenantId "$(TenantId)"
            # Every optional setting flows through env. An undefined variable
            # arrives as the literal "$(name)" and the script ignores it,
            # falling back to its built-in default. A runtime parameter, when
            # chosen, wins over the library value.
            env:
              Authority:               $(authority)
              BapApiRoot:              $(bapApiRoot)
              BapApiVersion:           $(bapApiVersion)
              PowerPlatformScope:      $(powerPlatformScope)
              PpApiRoot:               $(ppApiRoot)
              AppManagementApiVersion: $(appManagementApiVersion)
              PollIntervalSec:         $(pollIntervalSec)
              PollTimeoutMin:          $(pollTimeoutMin)
              DumpDiagnostics:         $(dumpDiagnostics)
              RetryFailedInstalls:     $(retryFailedInstalls)
              EnvironmentFilter:       $(environmentFilter)
              EnvironmentExclude:      $(environmentExclude)
              AppExclude:              $(appExclude)
              # Runtime-parameter overrides win when set; otherwise blank -> library/default.
              WhatIf:                  $(whatIfOverride)
              UsePacFallback:          $(usePacOverride)
